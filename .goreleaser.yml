version: 2
project_name: gphotos-uploader-cli
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
    - go mod download
builds:
  - goos:
      - darwin
      - linux
    goarch:
      - amd64
    ldflags: -s -w -X=github.com/gphotosuploader/gphotos-uploader-cli/version.versionString={{ .Version }}
checksum:
  name_template: 'checksums.txt'
release:
  # mark tags like v1.2.3-rc1 as pre-releases.
  prerelease: auto
brews:
  - repository:
      owner: gphotosuploader
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    # don't publish pre-releases to Homebrew users.
    skip_upload: auto
    commit_author:
      name: pacoorozco
      email: paco@pacoorozco.info
    homepage: https://github.com/gphotosuploader/gphotos-uploader-cli
    description: "Mass upload media folders to your Google Photos account(s)"
    test: system "#{bin}/gphotos-uploader-cli --help"
    install: bin.install "gphotos-uploader-cli"
changelog:
  # PRs are squash-merged with the PR title as the commit subject, so each entry is a PR title.
  use: github
  sort: asc
  abbrev: -1
  filters:
    exclude:
      - '^(docs|ci|test)(\(.+\))?!?:'
      - '^\[CI\]'
      - '^Merge pull request'
      - '^Merge branch'
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Dependencies
      regexp: '^[^:]*\(deps\)!?:'
      order: 2
    - title: Other changes
      order: 999
