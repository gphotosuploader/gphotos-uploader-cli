<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gphotos-uploader-cli</title>
  <meta name="description" content="Command-line tool to mass upload media folders to your Google Photos account.">
  <!-- Core Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
  <!-- Dark Mode Support -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css"
    media="(prefers-color-scheme: dark)" />
</head>

<body class="sidebar-chevron-right">
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'gphotos-uploader-cli',
      repo: 'gphotosuploader/gphotos-uploader-cli',
      auto2top: true,
      coverpage: true,
      loadNavbar: false,
      loadSidebar: true,
      subMaxLevel: 2,
      search: {
        noData: {
          '/': 'No results!'
        },
        depth: 2,
        paths: 'auto',
      },
      alias: {
        '.*?/changelog':
          'https://raw.githubusercontent.com/gphotosuploader/gphotos-uploader-cli/main/CHANGELOG.md',
        '.*?/upgrading':
          'https://raw.githubusercontent.com/gphotosuploader/gphotos-uploader-cli/main/UPGRADING.md',
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
</body>

</html>
