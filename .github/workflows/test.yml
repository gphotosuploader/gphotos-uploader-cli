name: Test, build and coverage
on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

env:
  # run coverage only with the latest Go version
  LATEST_GO_VERSION: "1.27"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-matrix:
    strategy:
      matrix:
        go-version: ["1.26", "1.27"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build binary
        run: make build
      - name: Run tests
        run: make test
      - name: Send code coverage
        if: success() && matrix.go-version == env.LATEST_GO_VERSION && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # single, stable check name to use as a required status check in branch protection.
  tests-passed:
    name: Tests passed
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check test-matrix result
        env:
          RESULT: ${{ needs.test-matrix.result }}
        run: test "$RESULT" = "success"
