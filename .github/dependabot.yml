version: 2
updates:
    -   package-ecosystem: 'gomod'
        directory: '/'
        schedule:
            interval: 'weekly'
        cooldown:
            default-days: 7
            semver-major-days: 14
        groups:
            go-dependencies:
                update-types:
                    - 'minor'
                    - 'patch'
        labels:
            - 'dependencies'
        commit-message:
            prefix: 'Bump'
            include: 'scope'

    -   package-ecosystem: 'github-actions'
        directory: '/'
        schedule:
            interval: 'monthly'
        cooldown:
            default-days: 7
        groups:
            github-actions:
                patterns:
                    - '*'
        labels:
            - 'dependencies'
        commit-message:
            prefix: '[CI]'
            include: 'scope'
